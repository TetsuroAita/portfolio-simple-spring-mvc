spring:
  config:
    activate:
      on-profile: dev

  boot:
    admin:
      client:
        url: ${HEALTH_MONITOR_URL}:${HEALTH_MONITOR_PORT:8081}
        username: ${HEALTH_MONITOR_USER}
        password: ${HEALTH_MONITOR_PASSWORD}
        instance:
          service-url: ${APP_URL}:${APP_PORT:8080}
          metadata:
            user.name: ${APP_ADMIN}
            user.password: ${APP_ADMIN_PASSWORD}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}?prepareThreshold=0
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      connection-test-query: "SELECT 1"
      maximum-pool-size: 10

scheduler:
  delete-avatars:
    fixed-rate-ms: 180000 # 3分
    initial-delay: 180000 # 3分